<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#A80000">
    <title>國立嘉義大學 - 2026 新春團拜</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #A80000; --bg-body: #F3F2F1; --text-main: #201F1E; }
        body { background-color: var(--bg-body); font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; padding-bottom: 90px; color: var(--text-main); user-select: none; }
        input, button { user-select: text !important; }
        
        /* Header & Nav */
        .header { background: linear-gradient(90deg, #A80000, #850000); color: white; height: 50px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #fff; border-top: 1px solid #ddd; z-index: 1000; display: flex; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font-size: 0.65rem; transition: 0.2s; }
        .nav-item i { font-size: 1.2rem; margin-bottom: 3px; }
        .nav-item.active { color: var(--primary); font-weight: 700; }
        
        /* Layout */
        .app-container { max-width: 500px; margin: 0 auto; padding: 15px; }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s; }
        
        /* Components */
        .fluent-input { width: 100%; padding: 12px; border: 1px solid #888; border-radius: 4px; outline: none; margin-bottom: 15px; }
        .fluent-input:focus { border-color: var(--primary); border-bottom-width: 2px; }
        .btn-win { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: white; border: 1px solid #888; color: #333; }
        
        /* Bonus UI */
        .bonus-locked-box { background: #E0E0E0; border-radius: 8px; padding: 40px 20px; text-align: center; color: #666; border: 2px dashed #999; margin-bottom: 20px; }
        .bonus-entry-box { background: #FFF; border: 2px solid #D4AF37; border-radius: 8px; padding: 25px 20px; text-align: center; margin-bottom: 20px; position: relative; }
        .bonus-success { background: #E8F5E9; border: 1px solid #4CAF50; border-radius: 8px; padding: 20px; text-align: center; color: #2E7D32; display: none; }
        
        /* Ticket UI */
        .pro-ticket { background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; margin-top: 10px; }
        .ticket-top { background: linear-gradient(135deg, #A80000, #D32F2F); padding: 15px; color: white; display: flex; align-items: center; gap: 10px; }
        .ticket-body { padding: 20px; }
        .ticket-num { font-family: 'Consolas', monospace; font-size: 1.8rem; font-weight: 800; color: #A80000; text-align: center; margin: 15px 0; letter-spacing: 2px; }
        .prize-ribbon { background: #FFF3E0; color: #E65100; padding: 8px; text-align: center; border-radius: 4px; margin-top: 10px; font-weight: bold; display: none; }
        
        /* Winner List */
        .winner-cell { background: white; border: 1px solid #eee; border-radius: 4px; padding: 8px; text-align: center; margin-bottom: 5px; font-size: 0.9rem; }
        .bonus-badge { background: #ffebeb; color: #a80000; border: 1px solid #ffc2c2; font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; }

        #toast-box { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 2000; width: 80%; pointer-events: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="header">
    <div style="font-weight:700;">NCYU 2026</div>
    <div style="font-size:0.8rem;">新春團拜</div>
</div>

<div id="toast-box"></div>

<div class="app-container">
    
    <div id="tab-checkin" class="view-section active">
        <div style="background:white; padding:20px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.05);">
            <h5 class="mb-3 fw-bold"><i class="fa-solid fa-user-check me-2"></i>教職員報到</h5>
            
            <div id="checkin-scan">
                <input type="text" id="inp-id" class="fluent-input" placeholder="請輸入教職員編號 (ID)" inputmode="text">
                <button onclick="app.doLookup()" class="btn-win btn-primary" id="btn-lookup">查詢</button>
            </div>

            <div id="checkin-confirm" style="display:none; text-align:center;">
                <h3 id="u-name" class="fw-bold mt-2">--</h3>
                <p id="u-dept" class="text-secondary">--</p>
                
                <div id="box-vcode" style="display:none;">
                    <input type="tel" id="inp-vcode" class="fluent-input text-center fs-4" placeholder="輸入螢幕驗證碼" maxlength="4">
                </div>
                
                <div class="d-flex gap-2 mt-3">
                    <button onclick="app.resetCheckin()" class="btn-win btn-outline">取消</button>
                    <button onclick="app.doCheckin()" class="btn-win btn-primary" id="btn-checkin">確認報到</button>
                </div>
            </div>

            <div id="checkin-done" style="display:none; text-align:center; padding:20px 0;">
                <i class="fa-solid fa-circle-check text-success fa-3x mb-3"></i>
                <h4>報到成功</h4>
                <p id="done-time" class="text-secondary font-monospace">--:--</p>
                <button onclick="app.nav('ticket')" class="btn-win btn-primary mt-2">查看票券</button>
            </div>
        </div>
    </div>

    <div id="tab-ticket" class="view-section">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="m-0 fw-bold">我的票券</h5>
            <button onclick="app.refreshUser(true)" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-rotate"></i> 刷新</button>
        </div>

        <div id="ticket-login" class="text-center py-5 text-secondary">
            <i class="fa-solid fa-lock fa-2x mb-2"></i><p>請先完成報到</p>
            <button onclick="app.nav('checkin')" class="btn btn-sm btn-primary">前往報到</button>
        </div>

        <div id="ticket-card" class="pro-ticket" style="display:none;">
            <div class="ticket-top">
                <div style="background:white; color:#A80000; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;"><i class="fa-solid fa-ticket"></i></div>
                <div><div class="fw-bold">NCYU 2026</div><div style="font-size:0.7rem; opacity:0.8;">RAFFLE TICKET</div></div>
            </div>
            <div class="ticket-body">
                <div class="d-flex justify-content-between mb-2">
                    <span><small class="d-block text-muted">姓名</small><b id="t-name">--</b></span>
                    <span class="text-end"><small class="d-block text-muted">單位</small><b id="t-dept">--</b></span>
                </div>
                <div class="ticket-num" id="t-eid">--</div>
                <div class="text-center text-muted small">報到時間: <span id="t-time">--</span></div>
                
                <div id="t-prize" class="prize-ribbon">
                    <i class="fa-solid fa-trophy"></i> <span id="t-prize-txt">--</span>
                </div>
            </div>
        </div>
    </div>

    <div id="tab-winners" class="view-section">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="m-0 fw-bold">中獎名單</h5>
            <button onclick="app.fetchWinners(true)" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-rotate"></i> 刷新</button>
        </div>
        <div id="list-winners" class="pb-5">
            <div class="text-center py-5 text-secondary">載入中...</div>
        </div>
    </div>

    <div id="tab-bonus" class="view-section">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="m-0 fw-bold text-danger"><i class="fa-solid fa-star me-1"></i>加碼專區</h5>
            <button onclick="app.checkBonusStatus()" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-rotate"></i> 檢查狀態</button>
        </div>

        <div id="bonus-locked" class="bonus-locked-box">
            <i class="fa-solid fa-lock fa-2x mb-3"></i>
            <h5>登記尚未開放</h5>
            <p class="small mb-3">主持人宣布開放後，請點擊上方「檢查狀態」按鈕</p>
        </div>

        <div id="bonus-form" class="bonus-entry-box" style="display:none;">
            <h4 class="fw-bold text-danger mb-3">現場加碼登記</h4>
            <input type="text" id="b-eid" class="fluent-input text-center fw-bold" placeholder="輸入員編 (例如 112001)">
            <input type="tel" id="b-code" class="fluent-input text-center fw-bold fs-4" placeholder="輸入現場驗證碼" maxlength="4">
            <button onclick="app.doBonus()" class="btn-win" style="background:#D4AF37; color:white;" id="btn-bonus">
                確認參加
            </button>
        </div>

        <div id="bonus-done" class="bonus-success" style="display:none;">
            <h4 class="fw-bold">登記成功！</h4>
            <p>您已具備加碼抽獎資格</p>
            <div class="text-muted small mt-2" id="b-time">--</div>
        </div>

        <hr>
        <h6 class="fw-bold text-secondary">加碼中獎名單</h6>
        <div id="list-bonus">
            <div class="text-center py-3 text-muted small">暫無資料 (請手動刷新)</div>
        </div>
    </div>

</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="app.nav('checkin')" id="nav-checkin"><i class="fa-solid fa-user-check"></i><span>報到</span></div>
    <div class="nav-item" onclick="app.nav('ticket')" id="nav-ticket"><i class="fa-solid fa-ticket"></i><span>票券</span></div>
    <div class="nav-item" onclick="app.nav('winners')" id="nav-winners"><i class="fa-solid fa-gift"></i><span>開獎</span></div>
    <div class="nav-item" onclick="app.nav('bonus')" id="nav-bonus"><i class="fa-solid fa-star"></i><span>加碼</span></div>
</div>

<script>
const API = 'https://personnel.kncyu.link/api/checkin/index.php';

const app = {
    user: null, // { employee_id, name, ... }
    
    init() {
        try { this.user = JSON.parse(localStorage.getItem('ncyu_u')); } catch(e){}
        this.nav('checkin');
    },

    // --- Navigation ---
    nav(tab) {
        document.querySelectorAll('.view-section').forEach(e => e.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
        document.getElementById('nav-' + tab).classList.add('active');
        
        // 分頁邏輯 (On-Demand)
        if(tab === 'ticket') this.renderTicket();
        if(tab === 'winners') this.fetchWinners();
        if(tab === 'bonus') this.checkBonusStatus();
    },

    // --- 1. Regular Checkin ---
    async doLookup() {
        const id = document.getElementById('inp-id').value.trim();
        if(!id) return alert('請輸入員編');
        
        this.loading('btn-lookup', true);
        try {
            // 先取得系統狀態看是 AUTO 還是 CODE
            const sRes = await fetch(`${API}?action=get_system_status`);
            const status = await sRes.json();
            
            // 查詢人員
            const res = await fetch(`${API}?action=get_participant_info&code=${id}`);
            const json = await res.json();
            
            if(json.success) {
                this.user = { ...json.data, qrcode: id }; // 暫存
                localStorage.setItem('ncyu_u', JSON.stringify(this.user));
                
                if(json.data.has_checked_in) {
                    this.showDone(json.data.check_in_time);
                } else {
                    // 顯示確認頁
                    document.getElementById('checkin-scan').style.display = 'none';
                    document.getElementById('checkin-confirm').style.display = 'block';
                    document.getElementById('u-name').innerText = this.user.name;
                    document.getElementById('u-dept').innerText = this.user.department;
                    
                    // 判斷是否顯示驗證碼框
                    if(status.data.checkin_mode_type === 'CODE') {
                        document.getElementById('box-vcode').style.display = 'block';
                    } else {
                        document.getElementById('box-vcode').style.display = 'none';
                    }
                }
            } else {
                alert('查無資料');
            }
        } catch(e) { alert('連線錯誤'); }
        this.loading('btn-lookup', false);
    },

    async doCheckin() {
        const vcode = document.getElementById('inp-vcode').value.trim();
        // 如果驗證碼框是顯示的，就必須檢查
        if(document.getElementById('box-vcode').style.display !== 'none' && !vcode) return alert('請輸入驗證碼');
        
        this.loading('btn-checkin', true);
        try {
            const res = await fetch(`${API}?action=check_in`, {
                method: 'POST', body: JSON.stringify({ qrcode: this.user.qrcode, verify_code: vcode })
            });
            const json = await res.json();
            if(json.success) {
                this.user.has_checked_in = true;
                this.user.check_in_time = json.data.check_in_time;
                localStorage.setItem('ncyu_u', JSON.stringify(this.user));
                this.showDone(json.data.check_in_time);
            } else {
                alert(json.message);
            }
        } catch(e) { alert('報到失敗'); }
        this.loading('btn-checkin', false);
    },

    showDone(t) {
        document.getElementById('checkin-scan').style.display='none';
        document.getElementById('checkin-confirm').style.display='none';
        document.getElementById('checkin-done').style.display='block';
        document.getElementById('done-time').innerText = t;
    },

    resetCheckin() {
        document.getElementById('checkin-scan').style.display='block';
        document.getElementById('checkin-confirm').style.display='none';
        document.getElementById('checkin-done').style.display='none';
        document.getElementById('inp-id').value='';
        document.getElementById('inp-vcode').value='';
    },

    // --- 2. Ticket ---
    renderTicket() {
        if(!this.user || !this.user.has_checked_in) {
            document.getElementById('ticket-login').style.display='block';
            document.getElementById('ticket-card').style.display='none';
            return;
        }
        document.getElementById('ticket-login').style.display='none';
        document.getElementById('ticket-card').style.display='block';
        
        document.getElementById('t-name').innerText = this.user.name;
        document.getElementById('t-dept').innerText = this.user.department;
        document.getElementById('t-eid').innerText = this.user.employee_id;
        document.getElementById('t-time').innerText = this.user.check_in_time;
        
        if(this.user.prize_name) {
            document.getElementById('t-prize').style.display = 'block';
            document.getElementById('t-prize-txt').innerText = this.user.prize_name;
        } else {
            document.getElementById('t-prize').style.display = 'none';
        }
    },
    
    async refreshUser(manual) {
        if(!this.user) return;
        try {
            const res = await fetch(`${API}?action=get_participant_info&code=${this.user.employee_id}`);
            const json = await res.json();
            if(json.success) {
                this.user = { ...this.user, ...json.data };
                localStorage.setItem('ncyu_u', JSON.stringify(this.user));
                this.renderTicket();
                if(manual) alert('已更新');
            }
        } catch(e){}
    },

    // --- 3. Winners (Fetch on demand) ---
    async fetchWinners(manual) {
        document.getElementById('list-winners').innerHTML = '<div class="text-center py-5 text-secondary">載入中...</div>';
        try {
            const res = await fetch(`${API}?action=get_winners`);
            const json = await res.json();
            if(json.success) this.renderLists(json.data);
            if(manual && json.success) alert('已更新名單');
        } catch(e){ document.getElementById('list-winners').innerText = '載入失敗'; }
    },

    renderLists(data) {
        let regular = '', bonus = '';
        data.forEach(g => {
            const isBonus = g.is_addon == 1 || g.prize_name.includes('加碼');
            const items = g.winners.map(w => `<div class="winner-cell">${w.name} <small class="text-muted">(${w.employee_id})</small></div>`).join('');
            const html = `
                <div class="mb-3">
                    <div class="fw-bold px-2 py-1 bg-white border rounded mb-1 d-flex justify-content-between">
                        <span>${g.prize_name}</span> <span class="badge bg-secondary">${g.winners.length}</span>
                    </div>
                    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:5px;">${items}</div>
                </div>`;
            if(isBonus) bonus += html; else regular += html;
        });
        
        document.getElementById('list-winners').innerHTML = regular || '<div class="text-center py-5">尚無名單</div>';
        document.getElementById('list-bonus').innerHTML = bonus || '<div class="text-center py-3 small text-muted">尚無名單</div>';
    },

    // --- 4. Bonus (Logic) ---
    async checkBonusStatus() {
        try {
            // 1. 檢查系統是否開放
            const res = await fetch(`${API}?action=get_system_status`);
            const json = await res.json();
            const isOpen = (json.data.bonus_mode === 'OPEN');

            // 2. 檢查我是否已登記 (如果有登入)
            if(this.user) {
                const uRes = await fetch(`${API}?action=get_participant_info&code=${this.user.employee_id}`);
                const uJson = await uRes.json();
                if(uJson.success) {
                    this.user.bonus_checkin_time = uJson.data.bonus_checkin_time;
                    localStorage.setItem('ncyu_u', JSON.stringify(this.user));
                }
            }

            // 3. 渲染 UI
            const locked = document.getElementById('bonus-locked');
            const form = document.getElementById('bonus-form');
            const done = document.getElementById('bonus-done');

            // 預設全部隱藏
            locked.style.display = 'none';
            form.style.display = 'none';
            done.style.display = 'none';

            if(this.user && this.user.bonus_checkin_time) {
                // 已完成
                done.style.display = 'block';
                document.getElementById('b-time').innerText = "登記時間: " + this.user.bonus_checkin_time;
            } else if(isOpen) {
                // 開放中，顯示表單
                form.style.display = 'block';
                // 自動帶入員編
                if(this.user) document.getElementById('b-eid').value = this.user.employee_id;
            } else {
                // 未開放
                locked.style.display = 'block';
            }
            
            // 順便更新下方的名單
            this.fetchWinners();

        } catch(e) { alert('檢查狀態失敗'); }
    },

    async doBonus() {
        const id = document.getElementById('b-eid').value.trim();
        const code = document.getElementById('b-code').value.trim();
        if(!id) return alert('請輸入員編');
        if(!code) return alert('請輸入現場驗證碼');
        
        this.loading('btn-bonus', true);
        try {
            const res = await fetch(`${API}?action=bonus_checkin`, {
                method: 'POST', body: JSON.stringify({ employee_id: id, verify_code: code })
            });
            const json = await res.json();
            if(json.success) {
                alert(json.message);
                if(this.user && this.user.employee_id === id) {
                    this.user.bonus_checkin_time = json.data.time;
                    localStorage.setItem('ncyu_u', JSON.stringify(this.user));
                }
                this.checkBonusStatus(); // 重整 UI
            } else {
                alert(json.message);
            }
        } catch(e) { alert('連線失敗'); }
        this.loading('btn-bonus', false);
    },

    loading(id, on) {
        const b = document.getElementById(id);
        if(b) b.disabled = on;
    }
};

app.init();
</script>
</body>
</html>
